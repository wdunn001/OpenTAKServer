<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenTAKServer — Sign in</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            background: #0f1419;
            color: #e8eaed;
        }
        .card {
            width: min(420px, 92vw);
            background: #1a1f2b;
            border: 1px solid #2a3142;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }
        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 600;
        }
        p.subtitle {
            margin: 0 0 24px;
            font-size: 14px;
            color: #9aa3b5;
        }
        .sso-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #0f1419;
            background: #ffb648;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: filter 120ms ease;
        }
        .sso-button:hover { filter: brightness(0.92); }
        .sso-button:focus { outline: 2px solid #ffb648; outline-offset: 3px; }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #5a6378;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #2a3142;
        }
        .local-link {
            display: block;
            text-align: center;
            font-size: 14px;
            color: #8fb0ff;
            text-decoration: none;
        }
        .local-link:hover { text-decoration: underline; }
        .disabled-note {
            font-size: 13px;
            color: #9aa3b5;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <h1>OpenTAKServer</h1>
        <p class="subtitle">Sign in to the web admin console.</p>

        {% if oidc_enabled %}
            <a class="sso-button" href="{{ oidc_login_url }}" id="sso-login">
                {{ button_label }}
            </a>
            <div class="divider">or</div>
            <a class="local-link" href="{{ flask_security_login_url }}">
                Sign in with a local account
            </a>
        {% else %}
            <p class="disabled-note">
                Single sign-on is not configured on this server.
                Use the local <a class="local-link" style="display:inline" href="{{ flask_security_login_url }}">username / password</a> form instead.
            </p>
        {% endif %}
    </main>
</body>
</html>
